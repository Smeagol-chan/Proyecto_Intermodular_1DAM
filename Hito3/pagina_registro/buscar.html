<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo_nav.css">
    <link rel="stylesheet" href="css/estilo_cont.css">
    <script src="javaScript/busquedaJs.js" defer></script>
    <title>roomie</title>
</head>

<body>
    <div class="navegador">
        <img src="img/logo.png" alt="Logo Roomie">
        <ul>
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="buscar.html">Buscar</a></li>
            <li><button class="btn_inicio" id="perfil"></button></li>
            <li><button class="btn_registro" id="registro">Cerrar Sesión</button></li>
        </ul>
    </div>
    <div class="contenedor_busqueda contenedor">

        <h1>Encuentra tu lugar ideal</h1>
        <br>
        <p>Encuentra pisos y habitaciones perfectas para ti en zonas universitarias y más</p>
        <br>

        <div class="formu_busqueda">
            <form action="#" method="post">
                <input type="search" name="busqueda" id="busqueda" placeholder="Busca por ciudad, barrio, zona...">
                <select name="precio" id="precio" class="filtro_precio">
                    <option value="">Precio Máximo</option>
                    <option value="300">Hasta 300€</option>
                    <option value="500">Hasta 500€</option>
                    <option value="700">Hasta 700€</option>
                    <option value="1000">Hasta 1000€</option>
                </select>

                <button type="submit" class="but_buscar">Buscar</button>
            </form>
        </div>

    </div>
</body>

</html>
